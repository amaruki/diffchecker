<svg xmlns="http://www.w3.org/2000/svg" width="118" height="20" role="img" aria-label="TypeScript: Strict">
  <title>TypeScript: Strict</title>
  <linearGradient id="bg" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1" />
    <stop offset="1" stop-opacity=".1" />
  </linearGradient>
  <clipPath id="clip">
    <rect width="118" height="20" rx="3" fill="#fff" />
  </clipPath>
  <g clip-path="url(#clip)">
    <rect width="72" height="20" fill="#3a4149" />
    <rect x="72" width="46" height="20" fill="#3178c6" />
    <rect width="118" height="20" fill="url(#bg)" />
  </g>
  <g fill="#fff" text-anchor="middle" font-family="'DejaVu Sans',Verdana,Geneva,sans-serif" font-size="11">
    <text x="36" y="15" fill="#010101" fill-opacity=".3">TypeScript</text>
    <text x="36" y="14">TypeScript</text>
    <text x="95" y="15" fill="#010101" fill-opacity=".3">Strict</text>
    <text x="95" y="14">Strict</text>
  </g>
</svg>
