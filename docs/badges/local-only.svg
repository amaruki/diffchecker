<svg xmlns="http://www.w3.org/2000/svg" width="162" height="20" role="img" aria-label="Privacy: 100% Local-Only">
  <title>Privacy: 100% Local-Only</title>
  <linearGradient id="bg" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1" />
    <stop offset="1" stop-opacity=".1" />
  </linearGradient>
  <clipPath id="clip">
    <rect width="162" height="20" rx="3" fill="#fff" />
  </clipPath>
  <g clip-path="url(#clip)">
    <rect width="54" height="20" fill="#3a4149" />
    <rect x="54" width="108" height="20" fill="#16a34a" />
    <rect width="162" height="20" fill="url(#bg)" />
  </g>
  <g fill="#fff" text-anchor="middle" font-family="'DejaVu Sans',Verdana,Geneva,sans-serif" font-size="11">
    <text x="27" y="15" fill="#010101" fill-opacity=".3">Privacy</text>
    <text x="27" y="14">Privacy</text>
    <text x="108" y="15" fill="#010101" fill-opacity=".3">100% Local-Only</text>
    <text x="108" y="14">100% Local-Only</text>
  </g>
</svg>
