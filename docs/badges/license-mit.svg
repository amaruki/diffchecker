<svg xmlns="http://www.w3.org/2000/svg" width="90" height="20" role="img" aria-label="License: MIT">
  <title>License: MIT</title>
  <linearGradient id="bg" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1" />
    <stop offset="1" stop-opacity=".1" />
  </linearGradient>
  <clipPath id="clip">
    <rect width="90" height="20" rx="3" fill="#fff" />
  </clipPath>
  <g clip-path="url(#clip)">
    <rect width="54" height="20" fill="#3a4149" />
    <rect x="54" width="36" height="20" fill="#0969da" />
    <rect width="90" height="20" fill="url(#bg)" />
  </g>
  <g fill="#fff" text-anchor="middle" font-family="'DejaVu Sans',Verdana,Geneva,sans-serif" font-size="11">
    <text x="27" y="15" fill="#010101" fill-opacity=".3">License</text>
    <text x="27" y="14">License</text>
    <text x="72" y="15" fill="#010101" fill-opacity=".3">MIT</text>
    <text x="72" y="14">MIT</text>
  </g>
</svg>
